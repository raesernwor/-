name: Weibo Monitor
on:
  schedule:
    - cron: '*/5 * * * *'   # 每5分钟一次（UTC时间，对应北京时间差不多）
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TARGET_UID: "2014433131"
          SCKEY: ${{ secrets.SCKEY }}
        run: |
          python3 - <<END
import requests
import json
import os
from datetime import datetime

TARGET_UID = os.environ["TARGET_UID"]
SCKEY = os.environ["SCKEY"]
CHECK_INTERVAL = 300

API_URL = f"https://weibo.com/ajax/statuses/mymblog?uid={TARGET_UID}&page=1&feature=0"
LAST_MID_FILE = "last_mid.txt"

def load_last_mid():
    try:
        with open(LAST_MID_FILE, "r", encoding="utf-8") as f:
            return f.read().strip()
    except:
        return ""

def save_last_mid(mid):
    with open(LAST_MID_FILE, "w", encoding="utf-8") as f:
        f.write(mid)

def push_wechat(title, desp):
    if not SCKEY:
        return
    url = f"https://sctapi.ftqq.com/{SCKEY}.send"
    data = {"title": title, "desp": desp}
    try:
        requests.post(url, data=data, timeout=10)
    except Exception as e:
        print("推送失败：", e)

def backup_to_file(name, ctime, text, mid, link):
    now = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
    content = f"""
============================================
抓取时间：{now}
博主：{name}
发布时间：{ctime}
内容：{text}
链接：{link}
MID: {mid}
============================================
"""
    with open("weibo_backup.txt", "a", encoding="utf-8") as f:
        f.write(content)

def main():
    last_mid = load_last_mid()
    headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
    try:
        res = requests.get(API_URL, headers=headers, timeout=10)
        data = res.json()
        blog_list = data["data"]["list"]
        if not blog_list:
            return
        latest = blog_list[0]
        current_mid = latest["mid"]
        if current_mid == last_mid:
            return
        save_last_mid(current_mid)
        user_name = latest["user"]["screen_name"]
        create_time = latest["created_at"]
        text = latest["text"].replace("<br/>", "\n")
        weibo_link = f"https://weibo.com/{TARGET_UID}/{current_mid}"
        title = f"{user_name} 新微博"
        desp = f"时间：{create_time}\n内容：{text}\n链接：{weibo_link}"
        push_wechat(title, desp)
        backup_to_file(user_name, create_time, text, current_mid, weibo_link)
        print("新微博已推送+备份")
    except Exception as e:
        print("异常：", e)

if __name__ == "__main__":
    main()
END

      - name: Commit & Push backup
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "auto backup: $(date '+%Y-%m-%d %H:%M:%S')" || true
          git push
